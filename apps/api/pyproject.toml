[project]
name = "repomind-api"
version = "0.1.0"
description = "FastAPI backend for RepoMind repository indexing jobs."
requires-python = ">=3.10"
dependencies = [
  "arq>=0.28.0,<0.29.0",
  "asyncpg>=0.30.0,<1.0.0",
  "fastapi[standard]>=0.115.0,<1.0.0",
  "httpx>=0.28.0",
  "langchain>=1.3.14",
  "langchain-mcp-adapters>=0.3.1",
  "langchain-openai>=1.0.0,<2.0.0",
  "langchain-text-splitters>=1.0.0,<2.0.0",
  "mcp==1.24.0",
  "tiktoken>=0.12.0,<1.0.0",
]

[tool.uv]
cache-dir = "../../.uv-cache"

[dependency-groups]
dev = [
  "mypy>=1.14.0,<2.0.0",
  "pytest>=8.3.0",
  "ruff>=0.9.0",
]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["asyncpg"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
